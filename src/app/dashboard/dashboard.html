<div class="dashboard-container">
  <mat-toolbar color="primary">
    <span>Portail Cabinet Comptable</span>
    <span class="spacer"></span>
    <ng-container *ngIf="currentUser$ | async as user">
      <span>Bienvenue, {{ user.nom }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Déconnexion">
        <mat-icon>logout</mat-icon>
      </button>
    </ng-container>
  </mat-toolbar>

  <div class="dashboard-content">
    <mat-card class="welcome-card">
      <mat-card-header>
        <mat-card-title>
          <h2>Tableau de bord</h2>
        </mat-card-title>
        <mat-card-subtitle>
          <p>Gérez vos documents et communications</p>
        </mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <ng-container *ngIf="currentUser$ | async as user">
          <div class="user-info">
            <h3>Informations utilisateur</h3>
            <p><strong>Nom:</strong> {{ user.nom }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Rôle:</strong> {{ user.role }}</p>
            <p><strong>Membre depuis:</strong> {{ user.createdAt | date:'dd/MM/yyyy' }}</p>
          </div>
        </ng-container>
      </mat-card-content>
    </mat-card>
  </div>
</div>
