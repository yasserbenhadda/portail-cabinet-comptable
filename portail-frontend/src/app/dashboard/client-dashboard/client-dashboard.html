<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Bienvenue {{ currentUser?.prenom }} {{ currentUser?.nom }}</h1>
    <button class="btn-logout" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      Déconnexion
    </button>
  </div>

  <div class="actions-grid top center">
    <button class="action-btn" (click)="goToUpload()">
      <i class="fas fa-file-upload"></i>
      <span>Uploader un document</span>
    </button>
    <button class="action-btn" (click)="goToMyDocuments()">
      <i class="fas fa-folder-open"></i>
      <span>Mes anciens documents</span>
    </button>
    <button class="action-btn" (click)="goToReceived()">
      <i class="fas fa-inbox"></i>
      <span>Documents reçus</span>
    </button>
  </div>

  <div class="actions-grid bottom center">
    <button class="nav-btn" (click)="goToProfile()">
      <i class="fas fa-user"></i>
      <span>Mon profil</span>
    </button>
    <button class="nav-btn" (click)="goToMessages()">
      <i class="fas fa-comments"></i>
      <span>Messages</span>
    </button>
  </div>
</div>
